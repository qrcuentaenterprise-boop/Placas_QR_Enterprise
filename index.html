<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Rent-A-Car - Ficha de Vehículo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos base de respaldo por si falla el CSS */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; overflow: hidden; }
    .header { background: #006633; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header img { height: 35px; }
    .hero { text-align: center; padding: 20px; background: #fafafa; position: relative; }
    .hero img { max-width: 100%; height: auto; max-height: 230px; object-fit: contain; }
    .plate-box { display: inline-block; background: #fdfdfd; border: 2px solid #333; border-radius: 6px; padding: 4px 12px; margin-top: 10px; font-weight: bold; letter-spacing: 2px; }
    .info-list { padding: 20px; }
    .info-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .info-label { color: #666; font-size: 0.9em; }
    .info-value { font-weight: 600; color: #222; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2 style="margin:0; font-size: 1.2rem;">ENTERPRISE</h2>
      <img id="brandLogo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Toyota_2020_logo.svg/1200px-Toyota_2020_logo.svg.png" alt="Marca">
    </div>

    <div class="hero">
      <h1 id="carTitle" style="margin: 0 0 10px 0; font-size: 1.5rem; color: #111;">Cargando vehículo...</h1>
      <img id="carImg" src="./img/default.png" alt="Fotografía del Vehículo">
      <br>
      <div class="plate-box">
        <span id="plateNumber">PLACA</span>
      </div>
    </div>

    <div class="info-list">
      <div class="info-item">
        <span class="info-label">Color:</span>
        <span class="info-value" id="colorValue">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Año:</span>
        <span class="info-value" id="anoValue">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Ubicación Actual:</span>
        <span class="info-value" id="locationValue">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">N.º Unidad:</span>
        <span class="info-value" id="unidValue">-</span>
      </div>
    </div>
  </div>

  <script>
    // 1. Obtener parámetro ?unid=... de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const unidadQuery = urlParams.get('unid');

    // 2. Función de Limpieza de Texto (Estructura idéntica a la del script de Python)
    function sanitizarTexto(texto) {
      if (!texto) return '';
      return String(texto)
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // Elimina tildes
        .replace(/[^a-z0-9]/g, '_')                       // Reemplaza caracteres no alfanuméricos por _
        .replace(/_+/g, '_')                              // Quita guiones bajos dobles
        .replace(/^_+|_+$/g, '');                         // Limpia extremos
    }

    // 3. Sistema de Carga Progresiva de Imagen (Fallback)
    function cargarImagenVehiculo(modelo, ano, color) {
      const imgElement = document.getElementById('carImg');

      const modClean = sanitizarTexto(modelo);
      const anoClean = sanitizarTexto(ano);
      const colClean = sanitizarTexto(color);

      // Extraer palabra principal del modelo (Ejemplo: "hilux_4x4" -> "hilux")
      const modBase = modClean.split('_')[0];

      // Lista priorizada de rutas de imagen a intentar
      const rutasAProbar = [
        `./img/${modClean}_${anoClean}_${colClean}.png`, // 1. Coincidencia exacta
        `./img/${modClean}_${colClean}.png`,             // 2. Modelo + Color
        `./img/${modClean}_${anoClean}.png`,             // 3. Modelo + Año
        `./img/${modClean}.png`,                          // 4. Modelo general
        `./img/${modBase}.png`,                           // 5. Marca/Línea principal
        `./img/default.png`                               // 6. Imagen de respaldo
      ];

      let indice = 0;

      function probarSiguienteRuta() {
        if (indice >= rutasAProbar.length) return;
        const ruta = rutasAProbar[indice];
        indice++;

        const tester = new Image();
        tester.onload = () => {
          imgElement.src = ruta; // Si la imagen existe en GitHub Pages, la asigna
        };
        tester.onerror = () => {
          probarSiguienteRuta(); // Si da error 404, prueba automáticamente la siguiente opción
        };
        tester.src = ruta;
      }

      probarSiguienteRuta();
    }

    // 4. Carga e Inyección de Datos desde vehiculos.json
    fetch('./vehiculos.json?v=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        if (!unidadQuery) {
          document.getElementById('carTitle').textContent = "Unidad no especificada";
          return;
        }

        // Buscar unidad en el JSON
        const vehiculo = data.find(v => {
          const unidVal = v.No_Unidad || v['N.º Unid. '] || v['No_Unidad'] || v['Unidad'];
          return String(unidVal).trim() === String(unidadQuery).trim();
        });

        if (vehiculo) {
          const modelo = vehiculo.Modelo || vehiculo['Modelo'] || 'VEHÍCULO';
          const ano = vehiculo.Ano || vehiculo['Año'] || '';
          const color = vehiculo.Color || vehiculo['Color'] || '';
          const placa = vehiculo.Placa || vehiculo['Placa'] || 'P-00000';
          const ubicacion = vehiculo.Ubicacion_Actual || vehiculo['Ubicación Actual'] || vehiculo.Sucursal || 'N/A';
          const unidNum = vehiculo.No_Unidad || vehiculo['N.º Unid. '] || unidadQuery;

          // Inyectar datos en la pantalla
          document.getElementById('carTitle').textContent = `${modelo} ${ano}`;
          document.getElementById('plateNumber').textContent = placa;
          document.getElementById('colorValue').textContent = color || 'N/A';
          document.getElementById('anoValue').textContent = ano || 'N/A';
          document.getElementById('locationValue').textContent = String(ubicacion) !== 'nan' ? ubicacion : 'N/A';
          document.getElementById('unidValue').textContent = unidNum;

          // Cargar imagen con coincidencia dinámica
          cargarImagenVehiculo(modelo, ano, color);
        } else {
          document.getElementById('carTitle').textContent = "Vehículo no encontrado";
        }
      })
      .catch(err => {
        console.error("Error cargando vehiculos.json:", err);
        document.getElementById('carTitle').textContent = "Error al cargar datos";
      });
  </script>
</body>
</html>
