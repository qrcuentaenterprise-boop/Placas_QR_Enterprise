<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del Vehículo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; padding: 25px; box-sizing: border-box; }
        .header { border-bottom: 2px solid #0056b3; padding-bottom: 12px; margin-bottom: 20px; text-align: center; }
        .header h2 { margin: 0; color: #0056b3; font-size: 22px; }
        .header p { margin: 5px 0 0 0; color: #666; font-weight: 600; }
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eef2f5; }
        .data-row:last-child { border-bottom: none; }
        .label { font-weight: 600; color: #495057; }
        .value { color: #212529; font-weight: 500; text-align: right; }
        .error { color: #dc3545; text-align: center; font-weight: bold; padding: 15px; }
    </style>
</head>
<body>

<div class="card" id="vehicleCard">
    <div class="header">
        <h2 id="modelo">Cargando...</h2>
        <p id="placa"></p>
    </div>
    <div id="details"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const unidadQuery = urlParams.get('unid');

    // Forzar actualización evitando caché con marca de tiempo
    fetch('./vehiculos.json?v=' + new Date().getTime())
        .then(response => {
            if (!response.ok) {
                throw new Error('No se encontró el archivo vehiculos.json (HTTP ' + response.status + ')');
            }
            return response.json();
        })
        .then(data => {
            if (!unidadQuery) {
                document.getElementById('vehicleCard').innerHTML = `<div class="error">No se especificó ninguna unidad en la URL (ejemplo: ?unid=233053).</div>`;
                return;
            }

            // Buscar coincidencia en el campo No_Unidad o 'N.º Unid. '
            const vehiculo = data.find(v => {
                const unidVal = v.No_Unidad || v['N.º Unid. '] || v['No_Unidad'];
                return String(unidVal).trim() === String(unidadQuery).trim();
            });

            if (vehiculo) {
                const modelo = vehiculo.Modelo || vehiculo['Modelo'] || 'Vehículo';
                const ano = vehiculo.Ano || vehiculo['Año'] || '';
                const placa = vehiculo.Placa || vehiculo['Placa'] || 'Sin Placa';
                const unid = vehiculo.No_Unidad || vehiculo['N.º Unid. '] || unidadQuery;

                document.getElementById('modelo').textContent = `${modelo} ${ano ? '(' + ano + ')' : ''}`;
                document.getElementById('placa').textContent = `Placa: ${placa} | Unidad: #${unid}`;

                const campos = [
                    { label: "Sucursal", val: vehiculo.Sucursal || vehiculo['Sucursal  '] },
                    { label: "Ubicación Actual", val: vehiculo.Ubicacion_Actual || vehiculo['Ubicación Actual'] },
                    { label: "Carrocería", val: vehiculo.Carroceria || vehiculo['Carrocería'] },
                    { label: "Color", val: vehiculo.Color || vehiculo['Color'] },
                    { label: "Kilómetros", val: vehiculo.Kilometros || vehiculo['Kilómetros'] },
                    { label: "Estado", val: vehiculo.Estado || vehiculo['Estado'] },
                    { label: "Últ. Arrendamiento", val: vehiculo.Ult_Arrendamiento || vehiculo['Últ. Arrend.'] },
                    { label: "Días Inactivo", val: vehiculo.Dia_Inactivo || vehiculo['dia inactivo'] },
                    { label: "Fecha Registro / Hoy", val: vehiculo.Dia_Hoy || vehiculo['Dia de hoy'] }
                ];

                let htmlContent = '';
                campos.forEach(c => {
                    const valorMostrar = (c.val !== undefined && c.val !== null && c.val !== '' && String(c.val) !== 'nan' && String(c.val) !== 'N/A') ? c.val : 'Sin datos';
                    htmlContent += `
                        <div class="data-row">
                            <span class="label">${c.label}:</span>
                            <span class="value">${valorMostrar}</span>
                        </div>`;
                });
                document.getElementById('details').innerHTML = htmlContent;
            } else {
                document.getElementById('vehicleCard').innerHTML = `<div class="error">No se encontró la unidad #${unidadQuery} en la base de datos.</div>`;
            }
        })
        .catch(err => {
            console.error("Error al procesar el archivo:", err);
            document.getElementById('vehicleCard').innerHTML = `<div class="error">Error al cargar la información.<br><br><small style="font-weight:normal; color:#666;">Detalle técnico: ${err.message}</small></div>`;
        });
</script>
</body>
</html>
